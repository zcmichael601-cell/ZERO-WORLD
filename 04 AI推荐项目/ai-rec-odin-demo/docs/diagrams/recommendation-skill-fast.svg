<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title description"><title id="title">极速版：程序召回，模型筛选与有界修正</title><desc id="description">shopping-recommendation-fast · PREPARED_RECOMMENDATION</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7488"/></marker></defs><rect width="1000" height="900" fill="white"/><polyline points="480,212 480,248" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,324 480,360" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,448 480,484" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,556 480,592" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,672 480,712" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253C4B"><tspan x="500" y="42" font-weight="600">极速版：程序召回，模型筛选与有界修正</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#607788"><tspan x="500" y="72" font-weight="400">shopping-recommendation-fast · PREPARED_RECOMMENDATION</tspan></text><rect x="220" y="94" width="170" height="28" rx="8" fill="#FFF4DF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="305" y="114" font-weight="400">Runtime / 代码</tspan></text><rect x="420" y="94" width="170" height="28" rx="8" fill="#EAF1FF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="505" y="114" font-weight="400">LLM 模型</tspan></text><rect x="620" y="94" width="170" height="28" rx="8" fill="#E8F5EE"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="705" y="114" font-weight="400">Tool / 数据</tspan></text><rect x="160" y="140" width="640" height="72" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="170" font-weight="600">RecommendationWorkflows → WorkflowExecutor</tspan><tspan x="480" y="194" font-weight="400">Runtime 主动加载 Skill；不请模型决定是否取数</tspan></text><rect x="160" y="248" width="640" height="76" rx="12" fill="#E8F5EE" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="280" font-weight="600">顺序执行 get_user_profile → get_user_behaviors</tspan><tspan x="480" y="304" font-weight="400">真实 UUID 查 AI Memory；演示用户读取固定画像与行为</tspan></text><rect x="160" y="360" width="640" height="88" rx="12" fill="#E8F5EE" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="386" font-weight="600">代码准备参数 → search_products</tspan><tspan x="480" y="410" font-weight="400">ProductSearchService 匹配目录标签；召回最多 6 件</tspan><tspan x="480" y="434" font-weight="400">过滤价格未知、过期、明确缺货和超预算商品</tspan></text><rect x="160" y="484" width="640" height="72" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="514" font-weight="600">prepareFastAnswer()：压缩事实，构建 Prompt</tspan><tspan x="480" y="538" font-weight="400">用户资料 + 候选与标签 + outputSchema</tspan></text><rect x="160" y="592" width="640" height="80" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="626" font-weight="600">LLM 相对优选并生成简短推荐</tspan><tspan x="480" y="650" font-weight="400">有候选选 1~2 件；无候选才可为空；不做 RAG</tspan></text><rect x="160" y="712" width="640" height="94" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="741" font-weight="600">校验 SKU、数量、分值和预算 → 回填商品卡</tspan><tspan x="480" y="765" font-weight="400">无效则复用事实让模型修正一次；不重跑工具</tspan><tspan x="480" y="789" font-weight="400">仍无效明确失败；不按目录顺序代选商品</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#607788"><tspan x="500" y="855" font-weight="400">模型正常 1 轮，最多 2 轮；工具固定 4 次，含 Skill 加载；用户工具顺序执行。</tspan><tspan x="500" y="879" font-weight="400">目标约 5 秒不是 SLA；跳过的是请求内 RAG，不是全服务的启动索引预加载。</tspan></text></svg>
