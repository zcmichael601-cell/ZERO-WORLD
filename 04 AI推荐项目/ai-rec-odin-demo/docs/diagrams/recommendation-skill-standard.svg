<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title description"><title id="title">普通版：模型自主规划的 Agent Loop</title><desc id="description">shopping-recommendation · AGENT · commerce handler</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7488"/></marker></defs><rect width="1000" height="950" fill="white"/><polyline points="480,212 480,250" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,326 480,370" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,466 480,510" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,570 900,570 900,418 800,418" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><polyline points="160,418 52,418 52,792 160,792" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253C4B"><tspan x="500" y="42" font-weight="600">普通版：模型自主规划的 Agent Loop</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#607788"><tspan x="500" y="72" font-weight="400">shopping-recommendation · AGENT · commerce handler</tspan></text><rect x="220" y="94" width="170" height="28" rx="8" fill="#FFF4DF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="305" y="114" font-weight="400">Runtime / 代码</tspan></text><rect x="420" y="94" width="170" height="28" rx="8" fill="#EAF1FF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="505" y="114" font-weight="400">LLM 模型</tspan></text><rect x="620" y="94" width="170" height="28" rx="8" fill="#E8F5EE"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="705" y="114" font-weight="400">Tool / 数据</tspan></text><rect x="160" y="140" width="640" height="72" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="170" font-weight="600">校验输入 → AgentLoopExecutor</tspan><tspan x="480" y="194" font-weight="400">首次只开放 Skill 工具；不预先执行用户查询</tspan></text><rect x="160" y="250" width="640" height="76" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="282" font-weight="600">LLM 请求加载 Skill → Runtime 返回指令</tspan><tspan x="480" y="306" font-weight="400">根据真实事实和本轮可用工具自主规划</tspan></text><rect x="160" y="370" width="640" height="96" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="400" font-weight="600">LLM 选择下一步：工具调用或最终答案</tspan><tspan x="480" y="424" font-weight="400">每轮提供事实状态；重复/截断有界恢复</tspan><tspan x="480" y="448" font-weight="400">可调整用户查询顺序、合并请求、补搜与补查</tspan></text><rect x="160" y="510" width="640" height="120" rx="12" fill="#E8F5EE" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="552" font-weight="600">整体审查工具计划 → 执行受控工具</tspan><tspan x="480" y="576" font-weight="400">画像/行为、商品搜索、RAG；写回真实结果</tspan><tspan x="480" y="600" font-weight="400">检查依赖、重复和预算，保护最终回答机会</tspan></text><rect x="160" y="750" width="640" height="84" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="786" font-weight="600">finish()：校验最终推荐后发布</tspan><tspan x="480" y="810" font-weight="400">校验 SKU、预算和原文引用；答案纠正不重跑工具</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="548" y="493" font-weight="400">需要工具</tspan></text><rect x="852" y="450" width="136" height="81" rx="8" fill="white"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="920" y="470" font-weight="400">工具结果</tspan><tspan x="920" y="494" font-weight="400">或重新规划</tspan><tspan x="920" y="518" font-weight="400">继续下一轮</tspan></text><rect x="5" y="561" width="136" height="81" rx="8" fill="white"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="73" y="581" font-weight="400">事实已足够</tspan><tspan x="73" y="605" font-weight="400">且必需工具</tspan><tspan x="73" y="629" font-weight="400">均已完成</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#607788"><tspan x="500" y="905" font-weight="400">模型轮数不固定；画像/行为各至多一次，搜索/知识各至多两次。</tspan><tspan x="500" y="929" font-weight="400">总上限仍为 8 / 8；拒绝相同参数的重复请求，允许有依据的补查。</tspan></text></svg>
