<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="title description"><title id="title">满血版：三轮决策，扩大召回与证据</title><desc id="description">shopping-recommendation-deep · DEEP_RECOMMENDATION_WORKFLOW</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7488"/></marker></defs><rect width="1000" height="1130" fill="white"/><polyline points="480,222 480,262" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,340 480,380" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,484 480,524" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,602 480,642" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,730 480,770" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,854 480,904" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,948 900,948 900,812 800,812" fill="none" stroke="#5B7488" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#253C4B"><tspan x="500" y="42" font-weight="600">满血版：三轮决策，扩大召回与证据</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#607788"><tspan x="500" y="72" font-weight="400">shopping-recommendation-deep · DEEP_RECOMMENDATION_WORKFLOW</tspan></text><rect x="220" y="94" width="170" height="28" rx="8" fill="#FFF4DF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="305" y="114" font-weight="400">Runtime / 代码</tspan></text><rect x="420" y="94" width="170" height="28" rx="8" fill="#EAF1FF"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="505" y="114" font-weight="400">LLM 模型</tspan></text><rect x="620" y="94" width="170" height="28" rx="8" fill="#E8F5EE"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="705" y="114" font-weight="400">Tool / 数据</tspan></text><rect x="160" y="140" width="640" height="82" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="175" font-weight="600">RecommendationWorkflows → WorkflowExecutor</tspan><tspan x="480" y="199" font-weight="400">Runtime 加载 Skill → 画像 → 行为；不消耗模型轮次</tspan></text><rect x="160" y="262" width="640" height="78" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="295" font-weight="600">LLM 第 1 轮：决定需求词与召回参数</tspan><tspan x="480" y="319" font-weight="400">受限 JSON 决策；Runtime 校验后转成工具调用</tspan></text><rect x="160" y="380" width="640" height="104" rx="12" fill="#E8F5EE" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="414" font-weight="600">search_products → DeepProductSearchTool</tspan><tspan x="480" y="438" font-weight="400">目录词汇匹配 + 多需求语义召回 → 融合、去重</tspan><tspan x="480" y="462" font-weight="400">基于有效快照/预算筛选，候选最多 48 件</tspan></text><rect x="160" y="524" width="640" height="78" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="557" font-weight="600">LLM 第 2 轮：选择最多 8 件商品深读</tspan><tspan x="480" y="581" font-weight="400">受限 JSON 决策，只能选本次已召回的 SKU</tspan></text><rect x="160" y="642" width="640" height="88" rx="12" fill="#E8F5EE" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="668" font-weight="600">retrieve_product_knowledge → 深读实现</tspan><tspan x="480" y="692" font-weight="400">展开所选 SKU 在同版索引中的全部原文片段</tspan><tspan x="480" y="716" font-weight="400">不是再次用一个 question 做少量片段召回</tspan></text><rect x="160" y="770" width="640" height="84" rx="12" fill="#EAF1FF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="806" font-weight="600">LLM 第 3 轮：生成推荐与多维对比</tspan><tspan x="480" y="830" font-weight="400">最多 6 件；选择 evidenceId + quoteId，不重抄原文</tspan></text><rect x="160" y="904" width="640" height="88" rx="12" fill="#FFF4DF" stroke="#C2D0DC" stroke-width="1.5"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#253C4B"><tspan x="480" y="930" font-weight="600">回填原文 → finish() 校验 → 发布</tspan><tspan x="480" y="954" font-weight="400">检查格式、SKU、预算、数量和引用；不合格不发布</tspan><tspan x="480" y="978" font-weight="400">允许有界修正最终 JSON，保留已完成的工具结果</tspan></text><rect x="852" y="836" width="136" height="81" rx="8" fill="white"/><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#253C4B"><tspan x="920" y="856" font-weight="400">校验需修正</tspan><tspan x="920" y="880" font-weight="400">且预算允许</tspan><tspan x="920" y="904" font-weight="400">不重复检索</tspan></text><text text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#607788"><tspan x="500" y="1085" font-weight="400">正常路径约 3 轮模型、5 次工具（含 Skill）。模型/工具配置上限为 12 / 20，不是目标次数。</tspan><tspan x="500" y="1109" font-weight="400">耗时主要取决于向量召回、模型推理和长答案生成；完整证据不等于独立测评。</tspan></text></svg>
