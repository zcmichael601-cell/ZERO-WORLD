<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>购物助手 v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 桌面背景 -->
  <div class="desktop-bg">

    <!-- 手机外壳 -->
    <div class="phone-frame">
      <div class="phone-screen">

        <!-- 状态栏 -->
        <div class="status-bar">
          <span class="status-time" id="statusTime">9:41</span>
          <div class="status-icons">
            <span class="material-icons-round">signal_cellular_alt</span>
            <span class="material-icons-round">wifi</span>
            <span class="material-icons-round">battery_full</span>
          </div>
        </div>

        <!-- ══ 页面：聊天 ══════════════════════════════ -->
        <div class="page active" id="page-chat">

          <header class="app-header">
            <div class="app-header-left">
              <span class="header-star">✦</span>
              <span class="header-title">购物助手</span>
            </div>
            <div class="app-header-right">
              <button class="icon-btn" id="newChatBtn" title="新对话">
                <span class="material-icons-round">edit_note</span>
              </button>
            </div>
          </header>

          <!-- 欢迎屏 -->
          <div class="welcome" id="welcome">
            <div class="welcome-star">✦</div>
            <div class="welcome-greeting">你好，今天想买什么？</div>
            <div class="welcome-sub">我会结合搜索和 AI，帮你找到最合适的商品</div>
            <div class="suggestion-grid">
              <button class="sg-card" onclick="sendChip('推荐一部拍照好的手机，预算4000以内')">
                <span class="material-icons-round sg-icon">photo_camera</span>
                <span>拍照好的手机</span>
              </button>
              <button class="sg-card" onclick="sendChip('游戏性能最强的手机推荐')">
                <span class="material-icons-round sg-icon">sports_esports</span>
                <span>游戏旗舰</span>
              </button>
              <button class="sg-card" onclick="sendChip('2000以内续航好的手机')">
                <span class="material-icons-round sg-icon">battery_charging_full</span>
                <span>续航好·2000内</span>
              </button>
              <button class="sg-card" onclick="sendChip('iPhone和小米旗舰怎么选？')">
                <span class="material-icons-round sg-icon">compare</span>
                <span>iPhone vs 小米</span>
              </button>
            </div>
          </div>

          <!-- 消息列表 -->
          <div class="chat-window" id="chatWindow"></div>

          <!-- 输入区 -->
          <div class="chat-footer">
            <div class="chips-row">
              <button class="chip" onclick="sendChip('推荐旗舰手机')">🏆 旗舰</button>
              <button class="chip" onclick="sendChip('3000以内性价比手机')">💰 3000内</button>
              <button class="chip" onclick="sendChip('最新发布的手机有哪些')">⚡ 最新款</button>
              <button class="chip" onclick="sendChip('华为手机推荐')">📱 华为</button>
              <button class="chip" onclick="sendChip('苹果iPhone推荐')">🍎 苹果</button>
            </div>
            <div class="composer">
              <textarea id="userInput" class="composer-input" placeholder="发消息… (⌘K 新对话)" rows="1"></textarea>
              <button class="send-btn" id="sendBtn" disabled>
                <span class="material-icons-round">arrow_upward</span>
              </button>
            </div>
          </div>
        </div>

        <!-- ══ 页面：发现 ══════════════════════════════ -->
        <div class="page" id="page-discover">
          <header class="app-header">
            <span class="header-title">发现好物</span>
            <div class="app-header-right">
              <button class="icon-btn" onclick="goChat('推荐手机')">
                <span class="material-icons-round">chat_bubble_outline</span>
              </button>
            </div>
          </header>
          <div class="discover-body">
            <!-- 场景筛选器 -->
            <div class="dfilter-row">
              <button class="dfilter-btn active" data-s="" onclick="loadDiscover('')">全部</button>
              <button class="dfilter-btn" data-s="游戏" onclick="loadDiscover('游戏')">🎮 游戏</button>
              <button class="dfilter-btn" data-s="拍照" onclick="loadDiscover('拍照')">📷 拍照</button>
              <button class="dfilter-btn" data-s="商务" onclick="loadDiscover('商务')">💼 商务</button>
              <button class="dfilter-btn" data-s="学生" onclick="loadDiscover('学生')">📚 学生</button>
              <button class="dfilter-btn" data-s="旗舰" onclick="loadDiscover('旗舰')">🏆 旗舰</button>
            </div>

            <!-- 动态商品格子 -->
            <div class="discover-grid" id="discoverGrid">
              <div class="discover-loading">加载中…</div>
            </div>

            <!-- 快速对话入口 -->
            <div class="section-title" style="margin-top:16px">按品牌找</div>
            <div class="category-grid">
              <div class="cat-item" onclick="goChat('苹果iPhone推荐')"><span>🍎</span><span>苹果</span></div>
              <div class="cat-item" onclick="goChat('华为手机推荐')"><span>🌺</span><span>华为</span></div>
              <div class="cat-item" onclick="goChat('小米手机推荐')"><span>🟠</span><span>小米</span></div>
              <div class="cat-item" onclick="goChat('OPPO手机推荐')"><span>🟢</span><span>OPPO</span></div>
              <div class="cat-item" onclick="goChat('vivo手机推荐')"><span>🔵</span><span>vivo</span></div>
              <div class="cat-item" onclick="goChat('荣耀手机推荐')"><span>⭐</span><span>荣耀</span></div>
            </div>
          </div>
        </div>

        <!-- ══ 页面：我的 ══════════════════════════════ -->
        <div class="page" id="page-profile">
          <header class="app-header">
            <span class="header-title">我的</span>
          </header>
          <div class="profile-body">
            <div class="profile-card">
              <div class="profile-avatar">Z</div>
              <div class="profile-info">
                <div class="profile-name">Zhaochen</div>
                <div class="profile-email">zcmichael601@gmail.com</div>
              </div>
            </div>

            <!-- 心愿单 -->
            <div class="section-title" style="margin-bottom:8px">
              ❤️ 我的心愿单
              <span class="wishlist-badge" id="wishlistBadge" style="display:none">0</span>
            </div>
            <div class="wishlist-section" id="wishlistSection">
              <div class="wishlist-empty">暂无收藏 · 去聊天找找感兴趣的手机吧</div>
            </div>

            <div class="menu-group" style="margin-top:16px">
              <div class="menu-item"><span class="material-icons-round menu-icon">history</span><span>历史对话</span><span class="material-icons-round menu-arrow">chevron_right</span></div>
              <div class="menu-item"><span class="material-icons-round menu-icon">notifications_none</span><span>消息通知</span><span class="material-icons-round menu-arrow">chevron_right</span></div>
            </div>
            <div class="menu-group">
              <div class="menu-item"><span class="material-icons-round menu-icon">tune</span><span>偏好设置</span><span class="material-icons-round menu-arrow">chevron_right</span></div>
              <div class="menu-item" onclick="showToast('v1.0 · Demo 购物导购助手')">
                <span class="material-icons-round menu-icon">info_outline</span><span>关于</span>
                <span class="menu-arrow" style="font-size:11px;color:var(--text-3)">v1.0</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部导航 -->
        <nav class="tab-bar">
          <button class="tab active" data-tab="chat" onclick="switchTab('chat')">
            <span class="material-icons-round tab-icon">chat_bubble_outline</span>
            <span class="tab-label">对话</span>
          </button>
          <button class="tab" data-tab="discover" onclick="switchTab('discover')">
            <span class="material-icons-round tab-icon">explore</span>
            <span class="tab-label">发现</span>
          </button>
          <button class="tab" data-tab="profile" onclick="switchTab('profile')">
            <span class="material-icons-round tab-icon">person_outline</span>
            <span class="tab-label">我的</span>
          </button>
        </nav>

      </div><!-- /phone-screen -->
    </div><!-- /phone-frame -->

  </div><!-- /desktop-bg -->

  <script src="app.js"></script>
</body>
</html>
